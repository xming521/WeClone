<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>数字分身</title>
<style>
  :root{
    --bg:#0b0d12; --bg2:#11141c; --line:#232936; --text:#e8ecf4; --muted:#8b93a5;
    --accent:#4f8cff; --accent2:#7c5cff; --bot:#171b24; --user:#2b5cff;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:
      radial-gradient(1200px 600px at 15% -10%, #1a2340 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #2a1a3d 0%, transparent 55%),
      var(--bg);
    color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:820px;height:100dvh;margin:0 auto;display:flex;flex-direction:column}
  header{
    display:flex;align-items:center;gap:12px;padding:14px 18px;
    border-bottom:1px solid var(--line);
    background:rgba(12,15,21,.72);backdrop-filter:blur(10px);
    position:sticky;top:0;z-index:5;
  }
  .avatar{
    width:38px;height:38px;border-radius:12px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px;
    box-shadow:0 6px 18px rgba(79,140,255,.35);
  }
  .who{min-width:0}
  .who h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px}
  .who p{margin:2px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
  .spacer{flex:1}
  .pill{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:rgba(255,255,255,.02)
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84}
  .ghost{
    border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:10px;padding:7px 11px;font-size:12px;cursor:pointer
  }
  .ghost:hover{color:var(--text);border-color:#39425a}

  #log{flex:1;overflow-y:auto;padding:22px 18px 8px;scroll-behavior:smooth}
  .row{display:flex;gap:10px;margin:0 0 18px;align-items:flex-end}
  .row.user{flex-direction:row-reverse}
  .badge{
    width:30px;height:30px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;
    font-size:12px;font-weight:600;background:#20263a;color:#9fb2d8;border:1px solid var(--line)
  }
  .row.user .badge{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0}
  .bubble{
    max-width:76%;padding:11px 14px;border-radius:var(--radius);
    background:var(--bot);border:1px solid var(--line);
    white-space:pre-wrap;word-break:break-word;
    border-bottom-left-radius:6px;
  }
  .row.user .bubble{
    background:linear-gradient(160deg,#2f63ff,#4f8cff);border:0;color:#fff;
    border-bottom-left-radius:var(--radius);border-bottom-right-radius:6px;
  }
  .bubble.error{border-color:#5a2a33;background:#2a1519;color:#ffb4c0}
  .typing{display:flex;gap:5px;align-items:center;height:20px}
  .typing i{width:6px;height:6px;border-radius:50%;background:#7b8499;animation:b 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}

  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;color:var(--muted);text-align:center}
  .empty .big{font-size:15px;color:#c9d3e6}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px}
  .chip{
    border:1px solid var(--line);background:rgba(255,255,255,.03);color:#c9d3e6;
    border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer
  }
  .chip:hover{border-color:var(--accent);color:#fff}

  form{display:flex;gap:10px;align-items:flex-end;padding:12px 18px 18px}
  .composer{
    flex:1;display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 14px;
    background:var(--bg2);border:1px solid var(--line);border-radius:18px;
    transition:border-color .15s,box-shadow .15s;
  }
  .composer:focus-within{border-color:#3b5aa8;box-shadow:0 0 0 4px rgba(79,140,255,.12)}
  textarea{
    flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);
    font:inherit;max-height:132px;min-height:24px;padding:6px 0
  }
  textarea::placeholder{color:#5f6779}
  .send{
    width:38px;height:38px;border:0;border-radius:12px;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    display:grid;place-items:center;transition:transform .12s,opacity .12s
  }
  .send:active{transform:scale(.94)}
  .send:disabled{opacity:.45;cursor:default}
  .foot{text-align:center;font-size:11px;color:#5f6779;padding:0 0 10px}
  @media (max-width:520px){
    .bubble{max-width:84%}
    header{padding:12px 14px}
    #log{padding:16px 12px 4px}
    form{padding:10px 12px 14px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">TA</div>
    <div class="who">
      <h1>数字分身</h1>
      <p id="meta"></p>
    </div>
    <div class="spacer"></div>
    <div class="pill"><span class="dot"></span><span id="state">在线</span></div>
    <button class="ghost" id="clear" type="button">清空</button>
  </header>

  <div id="log">
    <div class="empty" id="empty">
      <div class="big">说点什么，试试像不像</div>
      <div class="chips">
        <button class="chip" data-q="在干嘛呢">在干嘛呢</button>
        <button class="chip" data-q="今天好累啊">今天好累啊</button>
        <button class="chip" data-q="晚上吃啥">晚上吃啥</button>
        <button class="chip" data-q="你还记得上次说的那个事吗">还记得上次说的吗</button>
      </div>
    </div>
  </div>

  <form id="form">
    <div class="composer">
      <textarea id="q" rows="1" placeholder="说点什么…" autocomplete="off"></textarea>
      <button class="send" id="send" type="submit" aria-label="发送">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </form>
  <div class="foot">Enter 发送 · Shift+Enter 换行</div>
</div>

<script>
const MODEL = __MODEL__;
const SYSTEM = __SYSTEM__;
const KEY = __KEY__;

const HEADERS = {'Content-Type':'application/json'};
if (KEY) HEADERS['Authorization'] = 'Bearer ' + KEY;

const log = document.getElementById('log');
const empty = document.getElementById('empty');
const form = document.getElementById('form');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');
const stateEl = document.getElementById('state');
const meta = document.getElementById('meta');

meta.textContent = 'model: ' + MODEL;
const history = [];
let busy = false;

function nearBottom(){
  return log.scrollHeight - log.scrollTop - log.clientHeight < 120;
}
function scrollDown(force){
  if (force || nearBottom()) log.scrollTop = log.scrollHeight;
}
function bubble(role, text){
  if (empty && empty.parentNode) empty.remove();
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const badge = document.createElement('div');
  badge.className = 'badge';
  badge.textContent = role === 'user' ? '我' : 'TA';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(badge);
  row.appendChild(b);
  log.appendChild(row);
  scrollDown(true);
  return b;
}
function typingDots(el){
  el.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
}
function autosize(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 132) + 'px';
}

async function send(text){
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true; stateEl.textContent = '正在输入…';
  bubble('user', text);
  history.push({role:'user', content:text});

  const target = bubble('bot', '');
  typingDots(target);
  let acc = '';

  try{
    const res = await fetch('/v1/chat/completions', {
      method:'POST', headers:HEADERS,
      body:JSON.stringify({messages:history, stream:true})
    });
    if (!res.ok){
      const detail = await res.text();
      throw new Error(detail.slice(0, 300) || ('HTTP ' + res.status));
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let upstreamError = '';

    while (true){
      const chunk = await reader.read();
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, {stream:true});
      const events = buffer.split('\n\n');
      buffer = events.pop() || '';
      for (const evt of events){
        for (const line of evt.split('\n')){
          if (!line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if (!payload || payload === '[DONE]') continue;
          let json;
          try { json = JSON.parse(payload); } catch (e) { continue; }
          if (json.error){ upstreamError = json.error.message || 'upstream error'; continue; }
          const choice = json.choices && json.choices[0];
          const delta = choice && choice.delta && choice.delta.content;
          if (delta){
            if (acc === '') target.textContent = '';
            acc += delta;
            target.textContent = acc;
            scrollDown(false);
          }
        }
      }
    }

    if (upstreamError) throw new Error(upstreamError);

    if (!acc){
      // 有些网关会忽略 stream=true、直接回一整段 JSON；退化成非流式再试一次
      const plain = await fetch('/v1/chat/completions', {
        method:'POST', headers:HEADERS,
        body:JSON.stringify({messages:history, stream:false})
      });
      if (plain.ok){
        const data = await plain.json();
        const choice = data && data.choices && data.choices[0];
        const reply = choice && choice.message && choice.message.content;
        if (reply){
          acc = reply;
          target.textContent = reply;
        }
      }
    }

    if (!acc){
      target.classList.add('error');
      target.textContent = '（模型没有返回内容，稍后再试）';
    } else {
      history.push({role:'assistant', content:acc});
    }
  } catch (err){
    target.classList.add('error');
    target.textContent = '出错了：' + err.message;
  } finally {
    busy = false; sendBtn.disabled = false; stateEl.textContent = '在线';
    input.focus();
    scrollDown(true);
  }
}

form.addEventListener('submit', function(e){
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; autosize();
  send(text);
});

input.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    form.requestSubmit();
  }
});
input.addEventListener('input', autosize);

document.querySelectorAll('.chip').forEach(function(el){
  el.addEventListener('click', function(){
    send(el.dataset.q || el.textContent);
  });
});

document.getElementById('clear').addEventListener('click', function(){
  history.length = 0;
  log.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'empty';
  box.innerHTML = '<div class="big">清空了，重新开始</div>';
  log.appendChild(box);
  input.focus();
});

autosize();
input.focus();
</script>
</body>
</html>
