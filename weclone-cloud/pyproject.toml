[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "weclone-cloud"
version = "0.1.0"
description = "API-first pipeline: chat records -> scored dataset -> cloud fine-tune -> OpenAI-compatible persona endpoint (built on a vendored WeClone copy)"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pyjson5>=1.6",
  "rich>=13.0",
  "tqdm>=4.66",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
# tiktoken 首次使用会联网下载 BPE；无网络时自动退回字符估算
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=8.0"]

[project.scripts]
weclone-cloud = "weclone_cloud.cli:main"

[tool.setuptools.packages.find]
include = ["weclone_cloud*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
